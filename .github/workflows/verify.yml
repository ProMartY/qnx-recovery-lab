name: Verify host tools and recorded evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorded-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Audit reviewed source files
        run: python tools/package_source.py --check
      - name: Run Python regression tests
        run: python -m unittest discover -s prototype/tests -v
      - name: Verify the recorded guest trace and raw console
        run: |
          python prototype/check_trace.py
          python prototype/export_report.py
      - name: Rebuild the portable demonstration
        run: python prototype/build_demo.py --include-media
